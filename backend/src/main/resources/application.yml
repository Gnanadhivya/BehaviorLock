server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: behaviorlock-backend

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:h2:mem:behaviorlockdb;DB_CLOSE_DELAY=-1;MODE=MySQL}
    username: ${SPRING_DATASOURCE_USERNAME:sa}
    password: ${SPRING_DATASOURCE_PASSWORD:}
    driver-class-name: ${SPRING_DATASOURCE_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:google-demo-client-id.apps.googleusercontent.com}
            client-secret: ${GOOGLE_CLIENT_SECRET:demo-secret-key-google}
            scope:
              - email
              - profile

behaviorlock:
  jwt:
    secret: ${JWT_SECRET:404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000} # 24 hours
  ml-service:
    url: ${ML_SERVICE_URL:http://localhost:8000}

logging:
  level:
    root: INFO
    com.behaviorlock: DEBUG
